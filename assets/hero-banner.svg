<svg width="1200" height="290" viewBox="0 0 1200 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aashirwad Singh - Software Developer">
  <defs>
    <!-- Neutral Dark Gray Surface Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#14171D" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>

    <!-- Subtle Neutral Ambient Glows -->
    <radialGradient id="glowTopRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 40) rotate(135) scale(460 260)">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#3F3F46" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 260) rotate(-25) scale(420 220)">
      <stop offset="0%" stop-color="#52525B" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#27272A" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentLine" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0" />
      <stop offset="25%" stop-color="#71717A" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#71717A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#71717A" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#A1A1AA" fill-opacity="0.07" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="288" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="290" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="290" fill="url(#dotGrid)" />

    <rect x="0" y="0" width="1200" height="290" fill="url(#glowTopRight)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite" />
    </rect>
    <rect x="0" y="0" width="1200" height="290" fill="url(#glowBottomLeft)">
      <animate attributeName="opacity" values="1;0.8;1" dur="9s" repeatCount="indefinite" />
    </rect>

    <!-- Minimalist Architectural Corner Accents -->
    <g stroke="#71717A" stroke-opacity="0.3" stroke-width="1">
      <path d="M44 70 V42 H72" />
      <path d="M1156 70 V42 H1128" />
      <path d="M44 220 V248 H72" />
      <path d="M1156 220 V248 H1128" />
    </g>

    <!-- Subtle Side Lines -->
    <g stroke="#52525B" stroke-opacity="0.25" stroke-width="1">
      <line x1="88" y1="145" x2="176" y2="145" />
      <circle cx="176" cy="145" r="2.5" fill="#A1A1AA" fill-opacity="0.5" stroke="none" />
      <line x1="1024" y1="145" x2="1112" y2="145" />
      <circle cx="1024" cy="145" r="2.5" fill="#A1A1AA" fill-opacity="0.5" stroke="none" />
    </g>

    <!-- Top Status Pill -->
    <g transform="translate(600, 70)">
      <rect x="-118" y="-15" width="236" height="30" rx="15" fill="#18181B" stroke="#30363D" stroke-width="1" />
      <circle cx="-96" cy="0" r="3.8" fill="#D4D4D8">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="4" text-anchor="middle" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
        SOFTWARE DEVELOPER
      </text>
    </g>

    <!-- Display Name -->
    <text x="600" y="152" text-anchor="middle" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
      Aashirwad Singh
    </text>

    <!-- Subtitle -->
    <text x="600" y="194" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Building digital experiences, one commit at a time.
    </text>

    <!-- Bottom Accent Hairline -->
    <rect x="250" y="236" width="700" height="1.5" rx="0.75" fill="url(#accentLine)" />
    <circle cx="600" cy="236.75" r="2.5" fill="#E4E4E7" opacity="0.85">
      <animate attributeName="cx" values="420;780;420" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <rect x="1" y="1" width="1198" height="288" rx="14" stroke="url(#borderGrad)" stroke-width="1" />
</svg>
