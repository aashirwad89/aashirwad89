name: Generate Contribution Snake

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

  # Run when pushing to the default branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3f3f46&color_dots=#ebedf0,#d4d4d8,#a1a1aa,#71717a,#27272a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e4e4e7&color_dots=#161b22,#27272a,#3f3f46,#71717a,#d4d4d8

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
