  <!-- Subtle Index Pill -->
  <rect x="488" y="34" width="48" height="24" rx="6" fill="#171326" stroke="#2D2546" stroke-width="1" />
  <text x="512" y="50" text-anchor="middle" fill="#A1A1AA" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">02</text>
