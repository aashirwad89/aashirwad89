<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aashirwad Singh - Full Stack Developer and Software Engineer">
  <defs>
    <!-- Canvas & Surface Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#0C0B14" />
      <stop offset="100%" stop-color="#08080D" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27223B" />
      <stop offset="50%" stop-color="#5B21B6" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#27223B" />
    </linearGradient>

    <!-- Subtle Violet Ambient Glows -->
    <radialGradient id="glowTopRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 40) rotate(135) scale(460 280)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 270) rotate(-25) scale(420 240)">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#581C87" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#09090E" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentLine" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="25%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#A1A1AA" fill-opacity="0.08" />
    </pattern>

    <!-- Clip Path for Rounded Card -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="298" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="300" fill="url(#dotGrid)" />

    <!-- Ambient Glows -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#glowTopRight)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite" />
    </rect>
    <rect x="0" y="0" width="1200" height="300" fill="url(#glowBottomLeft)">
      <animate attributeName="opacity" values="1;0.8;1" dur="9s" repeatCount="indefinite" />
    </rect>

    <!-- Minimalist Architectural Corner Accents -->
    <g stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1">
      <path d="M44 74 V44 H74" />
      <path d="M1156 74 V44 H1126" />
      <path d="M44 226 V256 H74" />
      <path d="M1156 226 V256 H1126" />
    </g>

    <!-- Subtle Geometric Node Lines (Left & Right) -->
    <g stroke="#7C3AED" stroke-opacity="0.14" stroke-width="1">
      <line x1="88" y1="150" x2="176" y2="150" />
      <circle cx="176" cy="150" r="2.5" fill="#8B5CF6" fill-opacity="0.45" stroke="none" />
      <line x1="1024" y1="150" x2="1112" y2="150" />
      <circle cx="1024" cy="150" r="2.5" fill="#8B5CF6" fill-opacity="0.45" stroke="none" />
    </g>

    <!-- Top Status Pill -->
    <g transform="translate(600, 74)">
      <rect x="-178" y="-15" width="356" height="30" rx="15" fill="#13111C" stroke="#2E2647" stroke-width="1" />
      <circle cx="-156" cy="0" r="4" fill="#A855F7">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="4" text-anchor="middle" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">
        FULL STACK DEVELOPER  ·  SOFTWARE ENGINEER
      </text>
    </g>

    <!-- Display Name -->
    <text x="600" y="156" text-anchor="middle" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">
      Aashirwad Singh
    </text>

    <!-- Subtitle -->
    <text x="600" y="198" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" letter-spacing="0.2">
      Building digital experiences, one commit at a time.
    </text>

    <!-- Bottom Accent Hairline -->
    <rect x="250" y="242" width="700" height="1.5" rx="0.75" fill="url(#accentLine)" />
    <circle cx="600" cy="242.75" r="2.5" fill="#C084FC" opacity="0.9">
      <animate attributeName="cx" values="420;780;420" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="298" rx="16" stroke="url(#borderGrad)" stroke-width="1" />
</svg>
