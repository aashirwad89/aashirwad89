      <stop offset="0%" stop-color="#0B0B10" />
      <stop offset="100%" stop-color="#12101D" />
    </linearGradient>
    <radialGradient id="cglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 16) rotate(140) scale(220 120)">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0B10" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="558" height="94" rx="12" fill="url(#cbg)" stroke="#27223B" stroke-width="1" />
  <rect x="1" y="1" width="558" height="94" rx="12" fill="url(#cglow)" />

  <!-- Icon Container -->
  <rect x="20" y="22" width="52" height="52" rx="11" fill="#161324" stroke="#362C54" stroke-width="1" />
  <!-- Video / Real-time Signal Motif -->
  <g stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="31" y="38" width="18" height="14" rx="3" />
    <path d="M49 43 L58 38.5 V51.5 L49 47 Z" />
    <circle cx="36" cy="43" r="1.3" fill="#A855F7" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title & Category Tag -->
  <text x="88" y="45" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3">
